<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Superhero Card</title>
    <style>
     body {
         background-color: rgb(30, 17, 115);
         color: white;
         margin: 30px;
         font-family: Georgia, 'Times New Roman', Times, serif;  
        }

    .hero-name {
        font-size: 60px;
        font-weight: bold;
        color: #fff675;
        text-shadow: 5px 4px #ffb325;

    }

    .tagline{
        font-style: italic;
        font-size: larger;
        margin: 30px;
        color: rgb(111, 210, 255);
        text-transform: capitalize;
    }

    .label{
        text-transform: uppercase;
        text-decoration-line: underline;
        color: blanchedalmond;
    }

    .power{
        font-weight: bold;
        color: cadetblue;
         margin: 30px;
    }

    .weakness{
        text-decoration: line-through;
        color: grey;
         margin: 30px;
    }

    .badge{
        font-size: 28px;
        margin-top: 150px;
        font-weight: bold;
        color: bisque;
        transform: rotate(28deg);
    }

    .made-by{
        font-weight: bold;
        font-size: 30px;
        font-style: italic;
        color: rgb(146, 235, 255);
    }





    </style>
</head>
<body>
    <h1 class="hero-name">Thunder kids</h1>
    <p class="tagline">the most powerful hero in the school</p>

    <h2 class="label">super powers</h2>
    <p class="power">Can run faster than a cheetah</p>
    <p class="power">Can lift a school bus</p>

    <h2 class="label">Weaknesses</h2>
    <p class="weakness">Math homework</p>
    <p class="weakness">Broccoli</p>

    <p class="badge">Top hero</p>

    <p class="made-by">Created by Tanvi Tandon </p>
    



    
</body>
</html>
